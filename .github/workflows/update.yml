name: 更新市场温度计

on:
  schedule:
    # GitHub Actions cron 为 UTC。
    # 【重要】实测本 workflow 的系统性排队延迟为 1.4~1.8 小时（2026-09-02 三次样本：
    # +1.75h / +1.43h / +1.82h），cron 只是"期望时刻"而非保证时刻。
    # 故计划时间整体「提前约 1.5 小时」，让【实际出数据时刻】对齐右侧目标时间(UTC+8)：
    #   cron(UTC)  计划时刻    +延迟后实际出   目标用途
    #   0 0        08:00      ~09:30          开盘后
    #   30 0       08:30      ~10:00          盘中采样①（状态机轨迹）
    #   0 1        09:00      ~10:30          盘中采样②（状态机轨迹）
    #   30 1       09:30      ~11:00          盘中采样③（状态机轨迹）
    #   0 2        10:00      ~11:30          上午收盘前
    #   30 2       10:30      ~12:00          午间定格
    #   0 4        12:00      ~13:30          午后开盘
    #   30 4       12:30      ~14:00          盘中采样④（状态机轨迹）
    #   0 5        13:00      ~14:30          盘中采样⑤（状态机轨迹）
    #   30 5       13:30      ~15:00          尾盘
    #   30 6       14:30      ~16:00          收盘定论 ★最关键
    #   30 7       15:30      ~17:00          防延迟波动补刀
    #
    # 盘中加密采样目的：把「主力视角 regime 状态机」在一天内的切换过程
    # 记进 timeline.json，页面画「今日状态轨迹」。timeline 记录真实执行时刻，
    # 若某次因排队被 skip 只是少一个点，不影响轨迹正确性。
    - cron: "0 0 * * 1-5"     # 计划 08:00 -> 实际 ~09:30（开盘后）
    - cron: "30 0 * * 1-5"    # 计划 08:30 -> 实际 ~10:00（盘中采样）
    - cron: "0 1 * * 1-5"     # 计划 09:00 -> 实际 ~10:30（盘中采样）
    - cron: "30 1 * * 1-5"    # 计划 09:30 -> 实际 ~11:00（盘中采样）
    - cron: "0 2 * * 1-5"     # 计划 10:00 -> 实际 ~11:30（上午收盘前）
    - cron: "30 2 * * 1-5"    # 计划 10:30 -> 实际 ~12:00（午间定格）
    - cron: "0 4 * * 1-5"     # 计划 12:00 -> 实际 ~13:30（午后开盘）
    - cron: "30 4 * * 1-5"    # 计划 12:30 -> 实际 ~14:00（盘中采样）
    - cron: "0 5 * * 1-5"     # 计划 13:00 -> 实际 ~14:30（盘中采样）
    - cron: "30 5 * * 1-5"    # 计划 13:30 -> 实际 ~15:00（尾盘）
    - cron: "30 6 * * 1-5"    # 计划 14:30 -> 实际 ~16:00（收盘定论）
    - cron: "30 7 * * 1-5"    # 计划 15:30 -> 实际 ~17:00（收盘后补刀）
  workflow_dispatch: {}       # 手动触发

# 严禁并发：上一次没跑完，本次直接跳过（不取消、不排队）
concurrency:
  group: market-thermo-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 市场休市时段(周末/节假日)跑出来的数据无意义，直接跳过
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 计算市场温度计
        run: python3 thermo.py

      - name: 提交 data.json / data.js / timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js timeline.json timeline.js
          # 仅当数据有变化才提交（避免无意义的空 commit 触发 Pages 重建）
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新温度计数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
