name: 更新市场温度计

on:
  schedule:
    # 北京时间(UTC+8) 交易日：09:30 / 12:30 / 15:30(收盘后) / 18:30
    # GitHub Actions cron 为 UTC，故各减 8 小时
    - cron: "30 1 * * 1-5"    # 09:30 开盘后
    - cron: "30 4 * * 1-5"    # 12:30 午间
    - cron: "30 7 * * 1-5"    # 15:30 收盘后
    - cron: "30 10 * * 1-5"   # 18:30 盘后
  workflow_dispatch: {}       # 手动触发

# 严禁并发：上一次没跑完，本次直接跳过（不取消、不排队）
concurrency:
  group: market-thermo-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 市场休市时段(周末/节假日)跑出来的数据无意义，直接跳过
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 计算市场温度计
        run: python3 thermo.py

      - name: 提交 data.json / data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          # 仅当数据有变化才提交（避免无意义的空 commit 触发 Pages 重建）
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新温度计数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
