name: 市场温度计数据更新

on:
  schedule:
    # 北京 09:30 / 11:30 / 13:30 / 15:30（UTC+8，故 UTC 减 8）
    # 注意：GitHub 的 schedule 不保证准点，高峰可能延迟数分钟，属正常。
    - cron: '30 1,3,5,7 * * 1-5'
  workflow_dispatch:   # 允许在 GitHub 页面手动点「Run workflow」立即跑一次

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成快照 data.json
        run: python thermo.py

      - name: 校验数据完整性
        id: check
        run: |
          python - <<'PY'
          import json, datetime, os
          ok = True
          why = []
          try:
              d = json.load(open('data.json', encoding='utf-8'))
          except Exception as e:
              ok = False; why.append('data.json 解析失败: %s' % e); d = {}
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
          gen = d.get('generated_at', '')
          if not gen.startswith(today):
              ok = False; why.append('generated_at=%s 不是今天(%s)' % (gen, today))
          if not d.get('margin'):
              ok = False; why.append('两融 margin 缺失')
          if not (d.get('capital_read') or {}).get('regime'):
              ok = False; why.append('capital_read.regime 缺失')
          print('校验结果:', 'PASS' if ok else 'FAIL -> ' + '; '.join(why))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ok=%s\n' % ('true' if ok else 'false'))
              f.write('why=%s\n' % ('; '.join(why) or 'ok'))
          PY

      - name: 提交更新
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json timeline.json timeline.js
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 定时更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 快照"
            git push
          fi

      - name: 校验失败时保留旧数据
        if: steps.check.outputs.ok != 'true'
        run: |
          echo "::warning::本轮数据未通过校验，已保留上一版：${{ steps.check.outputs.why }}"
          git checkout -- data.json timeline.json timeline.js || true
