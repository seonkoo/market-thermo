<!DOCTYPE html><html><head><meta charset="utf-8"><title>PENDING</title></head>
<body><div id="out">…</div>
<script>
(function(){
  var log = [];
  var done = 0;
  function fin(){ if(++done >= 2){ document.title = 'NT ' + log.join(' | '); document.getElementById('out').textContent = document.title; } }
  var to = setTimeout(function(){ log.push('TIMEOUT'); document.title = 'NT ' + log.join(' | '); }, 9000);

  // ① 东财 push2delay JSONP：f12 代码 / f14 名称 / f100 行业
  function em(delay){
    var host = delay ? 'push2delay.eastmoney.com' : 'push2.eastmoney.com';
    var cb = '_emcb' + (delay ? '1' : '0');
    var tag = delay ? 'EM-delay' : 'EM-live';
    window[cb] = function(j){
      try{
        var d = (j && j.data && j.data.diff) || [];
        var s = [];
        for(var i = 0; i < d.length; i++) s.push(d[i].f12 + '=' + d[i].f14 + '/' + (d[i].f100 || '空'));
        log.push(tag + ':' + (s.length ? s.join(',') : 'NO_DIFF'));
      }catch(e){ log.push(tag + ':PARSE_ERR'); }
      fin();
    };
    var sc = document.createElement('script');
    sc.src = 'https://' + host + '/api/qt/ulist.np/get?fltt=2&secids=1.600176,1.588170&fields=f12,f14,f100&cb=' + cb;
    sc.onerror = function(){ log.push(tag + ':LOAD_ERR'); fin(); };
    document.body.appendChild(sc);
    setTimeout(function(){ if(log.filter(function(x){ return x.indexOf(tag) === 0; }).length === 0){ log.push(tag + ':NO_CB'); fin(); } }, 6000);
  }
  em(true); em(false);
  try{ log.push('origin=' + location.origin); }catch(e){ log.push('origin=?'); }
})();
</script>
</body></html>
