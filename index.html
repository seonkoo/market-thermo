<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股市场温度计</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --txt: #1a2330; --sub: #6b7785;
    --line: #e6eaf0; --accent: #2f6fed; --up: #e23b3b; --down: #14a05a;
    --bad: #e23b3b; --warn: #e08a00; --ok: #14a05a; --chip: #eef2f8;
  }
  [data-theme="dark"] {
    --bg: #11151c; --card: #1a212c; --txt: #e6ebf2; --sub: #8a97a8;
    --line: #2a3340; --accent: #5b8cff; --up: #ff5b5b; --down: #2ecc71;
    --bad: #ff5b5b; --warn: #ffb23d; --ok: #2ecc71; --chip: #232c39;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--txt); -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 18px 4px 14px;
  }
  header h1 { font-size: 21px; margin: 0; letter-spacing: 1px; }
  header .meta { font-size: 12px; color: var(--sub); }
  .spacer { flex: 1; }
  .tbtn {
    cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--txt); border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  .tbtn:hover { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; min-height: 120px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; color: var(--sub); font-weight: 400; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  /* 指数 */
  .grp-title { font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
  .idx-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .idx-row:last-child { border-bottom: none; }
  .idx-name { font-size: 13px; }
  .idx-val { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  .idx-pct { font-size: 12px; font-variant-numeric: tabular-nums; width: 64px; text-align: right; }
  /* 宽度 bar */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 96px; margin: 6px 0 2px; }
  .bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--sub); }
  .big { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .b-up { background: rgba(226,59,59,.12); color: var(--up); }
  .b-down { background: rgba(20,160,90,.12); color: var(--down); }
  .b-warn { background: rgba(224,138,0,.14); color: var(--warn); }
  .b-ok { background: rgba(20,160,90,.14); color: var(--ok); }
  .b-bad { background: rgba(226,59,59,.14); color: var(--bad); }
  .b-neutral { background: var(--chip); color: var(--sub); }
  /* 数据时效角标 */
  .ftag { display:inline-block; padding:2px 9px; border-radius:999px; font-size:10px; font-weight:700; margin-left:6px; vertical-align:middle; letter-spacing:.3px; }
  .f-live { background: rgba(20,160,90,.14); color: var(--ok); }
  .f-stale { background: rgba(224,138,0,.16); color: var(--warn); }
  .f-unset { background: rgba(226,59,59,.15); color: var(--bad); }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv .k { color: var(--sub); }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  /* 情绪分项 */
  .sub { margin-top: 10px; }
  .sub-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .sub-name { width: 76px; color: var(--sub); flex-shrink: 0; }
  .sub-track { flex: 1; height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .sub-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .sub-val { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .sub-w { width: 34px; text-align: right; color: var(--sub); font-size: 11px; }
  /* 资金流列表 */
  .flow { columns: 2; column-gap: 18px; }
  @media (max-width: 520px) { .flow { columns: 1; } }
  .flow-item { break-inside: avoid; display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; border-bottom: 1px dashed var(--line); }
  .flow-item .nm { color: var(--txt); }
  .flow-item .fl { font-variant-numeric: tabular-nums; font-weight: 600; }
  .sec-h { font-size: 12px; color: var(--sub); margin: 6px 0 2px; font-weight: 600; }
  .pill { display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px; background:var(--chip); color:var(--sub); margin-right:5px; }
  footer { color: var(--sub); font-size: 11px; line-height: 1.7; margin: 16px 4px 30px; }
  .warn-box { background: rgba(224,138,0,.08); border: 1px solid rgba(224,138,0,.3); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--warn); }
  .loading { text-align: center; padding: 60px 0; color: var(--sub); }
  /* 操作指引卡（综合研判，区别于纯数据卡） */
  .card.judge { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .judge .posture { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
  .judge .score-line { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .judge .score-track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .judge .score-fill { height: 100%; border-radius: 4px; }
  .judge .dim { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .judge .dim-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .judge .dim-h .lbl { color: var(--sub); font-weight: 400; }
  .judge .dim-advice { font-size: 12.5px; color: var(--txt); line-height: 1.5; margin: 2px 0 4px; }
  .judge .ev { font-size: 11.5px; color: var(--sub); line-height: 1.65; }
  .judge .ev div { margin: 1px 0; }
  /* 主力视角 hero 卡 */
  .card.capital { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .capital .regime { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
  .capital .posture-pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
  .capital .conf { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .capital .conf-track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .capital .conf-fill { height: 100%; border-radius: 4px; }
  .capital .sec-h { margin-top: 8px; color: var(--sub); }
  .capital .evi { font-size: 11.5px; color: var(--sub); line-height: 1.65; }
  .capital .evi div { margin: 1px 0; }
  .capital .act { font-size: 12.5px; line-height: 1.6; }
  .capital .act div { margin: 1px 0; }
  .capital .cau { font-size: 11.5px; color: var(--warn); line-height: 1.6; }
  .capital .cau div { margin: 1px 0; }
  /* 期指升贴水 */
  .basis-rows { margin: 4px 0 2px; }
  .basis-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .basis-row:last-child { border-bottom: none; }
  .basis-name { font-weight: 600; min-width: 64px; }
  .basis-num { font-variant-numeric: tabular-nums; text-align: right; color: var(--sub); }
  .basis-pct { font-variant-numeric: tabular-nums; width: 72px; text-align: right; font-weight: 600; }
  /* ETF 净流向 */
  .etf-sum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .etf-sum .big { font-size: 30px; }
  .etf-list .flow-item .fl.up { color: var(--up); }
  .etf-list .flow-item .fl.down { color: var(--down); }
  .chip-line { margin-top: 6px; }
  .chip-line .pill { margin-bottom: 4px; }
  /* 今日状态轨迹（主力 regime 盘中采样时间轴） */
  .tl { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .tl-title { font-size: 12px; color: var(--sub); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tl-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--chip); margin-bottom: 4px; }
  .tl-seg { height: 100%; min-width: 4px; }
  .tl-ticks { display: flex; font-size: 10px; color: var(--sub); margin-bottom: 6px; }
  .tl-ticks span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-steps { font-size: 11.5px; line-height: 1.9; color: var(--sub); }
  .tl-steps .st { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tl-steps .arr { margin: 0 4px; color: var(--line); }
  .tl-note { font-size: 10.5px; color: var(--sub); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 A股市场温度计</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button class="tbtn" id="themeBtn">🌗 主题</button>
    <button class="tbtn" id="modeBtn">⚡ 实时</button>
    <button class="tbtn" id="refreshBtn">↻ 刷新</button>
    <a class="tbtn" href="radar.html" style="text-decoration:none">🐺 做T雷达</a>
  </header>
  <div id="app"><div class="loading">数据加载中…</div></div>
  <footer>
    <div id="footnote"></div>
    <div style="margin-top:6px;">数据来源：东方财富（延时行情）、腾讯财经。指标为自定义算法，仅供研究参考，<b>不构成任何投资建议</b>。</div>
    <div style="margin-top:4px;">角标说明：<span class="ftag f-live" style="margin:0 2px">实时</span>盘中有效 · <span class="ftag f-stale" style="margin:0 2px">T-1·昨日</span>前一交易日收盘 · <span class="ftag f-unset" style="margin:0 2px">盘中未定·收盘定论</span>依赖当日K线、收盘才算数。</div>
  </footer>
</div>

<!-- file:// 双击打开时的 JSONP 兜底；Pages 上优先用 fetch(data.json) -->
<script src="data.js"></script>
<script src="timeline.js"></script>
<script>
const SCOPE_NOTE = "宽度为成交额Top800口径；流动性为全市场口径";

/* ---------- 主题 ---------- */
function applyTheme(t) {
  const theme = t === "auto"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : t;
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("thermo-theme", t);
}
(function initTheme(){
  const saved = localStorage.getItem("thermo-theme") || "auto";
  applyTheme(saved);
  const btn = document.getElementById("themeBtn");
  const cycle = { auto:"light", light:"dark", dark:"auto" };
  const label = { auto:"🌗 自动", light:"☀ 日间", dark:"🌙 夜间" };
  btn.textContent = label[saved];
  btn.onclick = () => {
    const cur = localStorage.getItem("thermo-theme") || "auto";
    const nx = cycle[cur];
    applyTheme(nx);
    btn.textContent = label[nx];
  };
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if ((localStorage.getItem("thermo-theme")||"auto") === "auto") applyTheme("auto");
  });
})();

/* ---------- 数据加载 ---------- */
async function loadData() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (r.ok) return await r.json();
    throw new Error("fetch json failed");
  } catch (e) {
    if (window.THERMO_DATA) return window.THERMO_DATA;
    throw e;
  }
}

/* 今日状态轨迹（timeline.json：Python 状态机在盘中的 regime 采样段） */
let TIMELINE = null;
async function loadTimeline() {
  try {
    const r = await fetch("timeline.json", { cache: "no-store" });
    if (r.ok) { TIMELINE = await r.json(); return; }
  } catch (e) { /* fallthrough */ }
  if (window.THERMO_TIMELINE) TIMELINE = window.THERMO_TIMELINE;
}

/* ================= 实时增强层（方案C：前端直连行情源）=================
   设计原则（避免双引擎、避免手机卡死）：
   1) 只实时化「一次请求就能拿到」的指标：指数/资金流/涨跌家数/行业/期指/ETF
   2) 宽度/流动性/两融/主力视角/操作指引 仍用快照 —— 前三者需 5209 只 K 线
      （手机必卡死），后两者本就是"收盘定论"，实时化反而误导
   3) 回退途径三条：
      ① index-snapshot.html 完整旧版（独立 URL）
      ② ?mode=snapshot 强制快照模式
      ③ 页面「实时/快照」按钮随时切换（记在 localStorage）
====================================================================== */
const EM_ULIST_RT = "https://push2delay.eastmoney.com/api/qt/ulist.np/get";
const EM_CLIST_RT = "https://push2delay.eastmoney.com/api/qt/clist/get";
const SINA_FUT_RT = "https://hq.sinajs.cn/list=";
const RT_IDX_SECIDS = "1.000001,0.399001,0.399006,1.000688,0.899050,100.HSI,100.HSCEI,100.N225,100.KS11,100.DJIA,100.NDX,100.SPX,100.UDI";
const RT_FUT_SPOT = { IF0:"1.000300", IC0:"1.000905", IH0:"1.000016", IM0:"1.000852" };
const RT_FUT_NAME = { IF0:"沪深300", IC0:"中证500", IH0:"上证50", IM0:"中证1000" };
const RT_REFRESH_MS = 30000;

const MODE_KEY = "thermo-mode";
function getMode() {
  const q = new URLSearchParams(location.search).get("mode");
  if (q === "snapshot") return "snapshot";
  if (q === "realtime") return "realtime";
  return localStorage.getItem(MODE_KEY) || "realtime";
}
function setMode(m) {
  localStorage.setItem(MODE_KEY, m);
  location.href = location.pathname + (m === "snapshot" ? "?mode=snapshot" : "");
}

let _cbSeq = 0;
function jsonp(url) {
  const cb = "__tcb_" + (++_cbSeq) + "_" + Date.now();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => finish(new Error("timeout")), 9000);
    window[cb] = (data) => { if (!done) { done = true; clearTimeout(timer); finish(null, data); } };
    s.onerror = () => { if (!done) { done = true; clearTimeout(timer); finish(new Error("network")); } };
    function finish(err, data) {
      try { delete window[cb]; s.remove(); } catch (e) {}
      err ? reject(err) : resolve(data);
    }
    s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + cb;
    document.head.appendChild(s);
  });
}

/* 新浪期指：返回 var hq_str_nf_IF0="..."，script 标签跨域后读全局变量 */
function sinaFutures() {
  return new Promise((resolve) => {
    const syms = Object.keys(RT_FUT_NAME);
    const s = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => finish(null), 9000);
    s.onload = () => {
      if (done) return;
      const out = {};
      syms.forEach(sym => {
        const v = window["hq_str_nf_" + sym];
        if (typeof v === "string" && v) {
          const p = v.split(",");
          const px = parseFloat(p[3]);   // 新浪 nf_ 格式：今开,最高,最低,最新 → 最新价在 [3]
          if (px) out[sym] = px;
        }
      });
      finish(out);
    };
    s.onerror = () => finish(null);
    function finish(v) { if (done) return; done = true; clearTimeout(timer); try { s.remove(); } catch(e){} resolve(v); }
    s.src = SINA_FUT_RT + syms.map(x => "nf_" + x).join(",");
    document.head.appendChild(s);
  });
}

async function fetchRealtime() {
  const rt = { ts: new Date() };
  const E = 1e8;
  const jobs = [];

  jobs.push(jsonp(`${EM_ULIST_RT}?fltt=2&secids=${RT_IDX_SECIDS}&fields=f1,f2,f3,f4,f12,f13,f14`)
    .then(j => {
      const diff = (((j || {}).data) || {}).diff || [];
      rt.indices = {};
      diff.forEach(d => { if (d.f2) rt.indices[d.f12] = { price: d.f2, pct: d.f3, change: d.f4 }; });
    }).catch(e => { rt.e1 = e.message; }));

  // 沪深资金流 + 涨跌家数（沪+深相加≈全市场，不含北交所，约差1.5%）
  jobs.push(jsonp(`${EM_ULIST_RT}?fltt=2&secids=1.000001,0.399001&fields=f12,f14,f62,f66,f72,f78,f84,f104,f105,f106`)
    .then(j => {
      const diff = (((j || {}).data) || {}).diff || [];
      let m=0, xl=0, lg=0, md=0, sm=0, up=0, dn=0, fl=0;
      diff.forEach(d => {
        m+=d.f62||0; xl+=d.f66||0; lg+=d.f72||0; md+=d.f78||0; sm+=d.f84||0;
        up+=d.f104||0; dn+=d.f105||0; fl+=d.f106||0;
      });
      rt.flow = { main_net:+(m/E).toFixed(1), xlarge_net:+(xl/E).toFixed(1),
                  large_net:+(lg/E).toFixed(1), mid_net:+(md/E).toFixed(1), small_net:+(sm/E).toFixed(1) };
      rt.breadth = { up, down: dn, flat: fl };
    }).catch(e => { rt.e2 = e.message; }));

  jobs.push(jsonp(`${EM_ULIST_RT}?fltt=2&secids=${Object.values(RT_FUT_SPOT).join(",")}&fields=f12,f2`)
    .then(j => {
      const diff = (((j || {}).data) || {}).diff || [];
      rt.spots = {};
      diff.forEach(d => { if (d.f2) rt.spots[d.f12] = d.f2; });
    }).catch(e => { rt.e3 = e.message; }));

  jobs.push(jsonp(`${EM_CLIST_RT}?fid=f62&po=1&pz=200&pn=1&np=1&fltt=2&invt=2&fs=${encodeURIComponent("m:90+t:2")}&fields=f12,f14,f62,f184,f3`)
    .then(j => {
      const raw = (((j || {}).data) || {}).diff || [];
      const arr = (Array.isArray(raw) ? raw : Object.values(raw))
        .map(d => ({ name: d.f14, flow: +((d.f62||0)/E).toFixed(1), pct: d.f3 }))
        .filter(x => x.name).sort((a,b) => b.flow - a.flow);
      rt.sector = { n: arr.length, top: arr.slice(0,12), bottom: arr.slice(-12).reverse() };
    }).catch(e => { rt.e4 = e.message; }));

  jobs.push(jsonp(`${EM_CLIST_RT}?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f62&fs=${encodeURIComponent("m:1+t:9")}&fields=f12,f14,f2,f3,f62,f184`)
    .then(j => {
      const raw = (((j || {}).data) || {}).diff || [];
      const arr = Array.isArray(raw) ? raw : Object.values(raw);
      let sum = 0;
      arr.forEach(d => { sum += (d.f62||0); });
      rt.etf = { net_sum_yi: +(sum/E).toFixed(1) };
    }).catch(e => { rt.e5 = e.message; }));

  jobs.push(sinaFutures().then(v => { rt.fut = v; }).catch(() => { rt.fut = null; }));

  await Promise.all(jobs);
  return rt;
}

/* 用实时数据覆盖快照字段（只覆盖能实时的部分，其余原样保留） */
function applyRealtime(d, rt) {
  if (rt.indices) {
    d.indices.forEach(x => {
      const r = rt.indices[x.code];
      if (r && r.price) { x.price = r.price; x.pct = r.pct; x.change = r.change; }
    });
  }
  if (rt.flow) d.flow = Object.assign({}, d.flow, rt.flow);
  if (rt.breadth) {
    const t = rt.breadth.up + rt.breadth.down + rt.breadth.flat;
    d.breadth_count = Object.assign({}, d.breadth_count, {
      up: rt.breadth.up, down: rt.breadth.down, flat: rt.breadth.flat,
      advance_pct: t ? +(rt.breadth.up / t * 100).toFixed(1) : 0
    });
  }
  if (rt.sector && rt.sector.top && rt.sector.top.length) {
    d.sector = Object.assign({}, d.sector, rt.sector);
  }
  if (rt.etf && rt.etf.net_sum_yi != null) {
    d.etf_flow = Object.assign({}, d.etf_flow, { net_sum_yi: rt.etf.net_sum_yi });
  }
  if (rt.fut && rt.spots) {
    const items = [], bps = [];
    Object.keys(RT_FUT_NAME).forEach(sym => {
      const fut = rt.fut[sym], sec = RT_FUT_SPOT[sym], code = sec.split(".")[1];
      const spot = rt.spots[code];
      if (!fut || !spot) return;
      const basis = +(fut - spot).toFixed(2);
      const bp = +(basis / spot * 100).toFixed(3);
      bps.push(bp);
      items.push({ name: RT_FUT_NAME[sym], fut: +fut.toFixed(2), spot: +spot.toFixed(2),
                   basis, basis_pct: bp,
                   stance: bp > 0.10 ? "升水" : (bp < -0.30 ? "贴水" : "持平") });
    });
    if (items.length) {
      const avg = +(bps.reduce((a,b)=>a+b,0) / bps.length).toFixed(3);
      d.futures_basis = Object.assign({}, d.futures_basis, {
        items, avg_basis_pct: avg,
        attitude: avg > 0.10 ? "主力偏多/看涨" : (avg < -0.30 ? "主力偏空/避险" : "中性")
      });
    }
  }
  if (!d.freshness) d.freshness = {};
  ["indices","flow","breadth_count","sector","etf_flow","futures_basis"].forEach(k => {
    d.freshness[k] = { label: "秒级实时", cls: "live" };
  });
  d._rt_ts = rt.ts;
  d._rt = true;
}

/* ---------- 工具 ---------- */
const fmt = (v, d=2) => v==null ? "—" : Number(v).toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d});
const cls = v => v==null ? "" : (v > 0 ? "up" : (v < 0 ? "down" : ""));
const sign = v => v==null ? "" : (v > 0 ? "+" : "");
const pctTxt = v => v==null ? "—" : `${sign(v)}${fmt(v,2)}%`;

/* ---------- 渲染 ---------- */
let FRESH = {};
function freshTag(key) {
  const f = FRESH[key];
  if (!f) return "";
  return `<span class="ftag f-${f.cls}">${f.label}</span>`;
}
function card(title, tag, inner, freshKey) {
  const ftag = freshKey ? freshTag(freshKey) : "";
  return `<div class="card"><h2>${title}${ftag}${tag?`<span class="tag">${tag}</span>`:""}</h2>${inner}</div>`;
}

function judgeTone(label) {
  if (/防御|降仓|不追|分歧|撤离|收缩/.test(label)) return "var(--bad)";
  if (/加仓|低吸|偏多|扩张/.test(label)) return "var(--ok)";
  if (/题材|微盘/.test(label)) return "var(--warn)";
  return "var(--sub)";
}
function judgeBadge(label) {
  if (/防御|降仓|不追|分歧|撤离|收缩/.test(label)) return "b-bad";
  if (/加仓|低吸|偏多|扩张/.test(label)) return "b-ok";
  if (/题材|微盘/.test(label)) return "b-warn";
  return "b-neutral";
}
function renderJudgement(d) {
  const j = d.judgement;
  if (!j) return "";
  const sc = j.position.score;
  const scColor = sc >= 60 ? "var(--ok)" : sc >= 40 ? "var(--warn)" : "var(--bad)";
  const dim = (title, obj) => `
    <div class="dim">
      <div class="dim-h"><span class="lbl">${title}</span><span class="badge ${judgeBadge(obj.label)}">${obj.label}</span></div>
      <div class="dim-advice">${obj.advice}</div>
      <div class="ev">${obj.evidence.map(e => `<div>· ${e}</div>`).join("")}</div>
    </div>`;
  return `<div class="card judge">
    <h2>🎯 操作指引 <span class="tag">综合研判 · 非投资建议</span>${freshTag("judgement")}</h2>
    <div class="posture" style="color:${judgeTone(j.position.label)}">${j.posture}</div>
    <div class="score-line">进攻倾向 <b style="color:${scColor}">${sc}</b> / 100
      <div class="score-track"><div class="score-fill" style="width:${sc}%;background:${scColor}"></div></div>
    </div>
    ${dim("仓位", j.position)}
    ${dim("风格", j.style)}
    ${dim("节奏", j.timing)}
    ${dim("主线", j.mainline)}
    <div class="note" style="margin-top:10px">${j.summary}</div>
  </div>`;
}

function renderBreadth(d) {
  const b = d.breadth;

  const maxV = Math.max(...b.grid.map(g => g.pct_above), 1);
  const bars = b.grid.map(g => {
    const c = g.pct_above >= 60 ? "var(--up)" : (g.pct_above <= 40 ? "var(--down)" : "var(--accent)");

  }).join("");

}
function renderCapitalRead(d) {

      ${d.etf_flow ? `<span class="pill" style="color:${d.etf_flow.signal.indexOf('布局')>=0?'var(--up)':(d.etf_flow.signal.indexOf('撤离')>=0?'var(--down)':'var(--sub)')}">ETF ${d.etf_flow.signal}</span>` : ''}

/* ---------- 今日状态轨迹（regime 盘中变化时间轴） ---------- */
function renderTimeline(d) {
  const tl = TIMELINE;
  const segs = (tl && tl.segments) || [];
  if (!segs.length) return "";
  const todayStr = tl.date || "";
  // 时间轴只对「当天」有意义；若 data.json 与 timeline 不是同一天，多半是跨日/数据未更新
  const fresh = todayStr === (d.generated_at || "").slice(0, 10);
  // 色带：每个采样段按时间比例画一条色块，切换点一目了然
  const t0 = segs[0].s, t1 = segs[segs.length - 1].e;
  const toMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + m; };
  const span = Math.max(toMin(t1) - toMin(t0) + 1, 1);
  const bar = segs.map(s => {
    const w = Math.min((toMin(s.e) - toMin(s.s) + 1) / span * 100, 100);
    const col = regimeTone(s.regime).c;
    return `<div class="tl-seg" style="width:${w}%;background:${col}" title="${s.s}~${s.e} ${s.regime}"></div>`;
  }).join("");
  const ticks = segs.map(s => `<span>${s.s}</span>`).join("");
  const steps = segs.map((s, i) =>
    (i > 0 ? `<span class="arr">→</span>` : "") +
    `<span class="st" style="color:${regimeTone(s.regime).c}">${s.s}~${s.e} ${s.regime}</span>`
  ).join("");
  const note = fresh
    ? "时段为 Python 状态机每次盘中采样的真实运行时刻；收盘后定格，盘中切换仅供参考。"
    : `轨迹日期 ${todayStr} 与当前数据日 ${d.generated_at.slice(0,10)} 不一致——数据可能未更新或已跨日。`;
  return `<div class="card tl-card">
    <h2>⏱ 今日状态轨迹 <span class="tag">主力 regime 盘中采样 · 每~30分钟</span>${fresh ? freshTag("capital_read") : ""}</h2>
    <div class="tl-bar">${bar}</div>
    <div class="tl-ticks">${ticks}</div>
    <div class="tl-steps">${steps}</div>
    <div class="tl-note">${note}</div>
  </div>`;
}

     </div>
     <div class="note">宽基/指数 ETF 合计净流入 ${fmt(e.broad_in_yi,1)} 亿</div>
     <div class="etf-list">
       <div class="sec-h">净流入 Top</div><div class="flow">${inList || '<div class="note">—</div>'}</div>
       ${outList ? `<div class="sec-h">净流出 Bottom</div><div class="flow">${outList}</div>` : ''}
     </div>
     <div class="note">机构借道 ETF 申购/赎回，是观察大资金态度的一面镜子。</div>`, "etf_flow");
}

function render(d) {
  FRESH = d.freshness || {};
  // 把权重透传给情绪分项显示
  d._w = (d.__cfg_w) || undefined;
  const grid = document.getElementById("app");
  grid.className = "grid";
  grid.innerHTML =
    renderCapitalRead(d) + renderTimeline(d) + renderJudgement(d) + renderIndices(d) + renderBreadth(d) +
    renderFuturesBasis(d) + renderEtfFlow(d) + renderFlow(d) +
    renderBreadthCount(d) + renderEmotion(d) +
    renderLiquidity(d) + renderMargin(d) + renderSector(d);
  const metaEl = document.getElementById("meta");
  if (d._rt && d._rt_ts) {
    const p2 = n => String(n).padStart(2, "0");
    const t = d._rt_ts;
    metaEl.textContent =
      `⚡ 实时 ${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())}` +
      ` · ${d.scope_note || SCOPE_NOTE} · 快照基线 ${d.generated_at || ""}`;
  } else {
    metaEl.textContent =
      `${d.generated_at || ""} · ${d.scope_note || SCOPE_NOTE} · 耗时 ${d.elapsed||"?"}s`;
  }
  const fw = document.getElementById("footnote");
  if (d.warnings && d.warnings.length) {
    fw.innerHTML = `<div class="warn-box">⚠ 本次计算提示：<br>` +
      d.warnings.map(w => "· " + w).join("<br>") + `</div>`;
  } else { fw.innerHTML = ""; }
}

document.getElementById("refreshBtn").onclick = () => location.reload();

/* ---------- 模式切换按钮（回退途径③：随时切回纯快照）---------- */
const MODE = getMode();
const modeBtn = document.getElementById("modeBtn");
modeBtn.textContent = MODE === "realtime" ? "⚡ 实时" : "📷 快照";
modeBtn.title = MODE === "realtime"
  ? "当前：秒级实时（点击切回纯快照模式）"
  : "当前：纯快照（点击开启秒级实时）";
modeBtn.onclick = () => setMode(MODE === "realtime" ? "snapshot" : "realtime");

loadData().then(async d => {
  await loadTimeline();            // ① 先读当日状态轨迹（失败则保持 TIMELINE=null，卡片自动隐藏）
  render(d);                       // ① 先用快照秒开，不白屏
  if (MODE !== "realtime") return; // 快照模式到此为止
  try {
    applyRealtime(d, await fetchRealtime());
    render(d);                     // ② 实时数据到位后重渲染
    setInterval(async () => {      // ③ 每 30 秒自动刷新
      try {
        applyRealtime(d, await fetchRealtime());
        await loadTimeline();      // 轨迹也跟随刷新（盘中新增采样点即时出现）
        render(d);
      } catch (e) { /* 单次失败静默，下轮自动重试 */ }
    }, RT_REFRESH_MS);
  } catch (e) {
    // 实时失败不影响快照显示，仅提示（用户可一键切回快照）
    document.getElementById("footnote").innerHTML =
      `<div class="warn-box">⚠ 实时行情拉取失败（${e.message}），当前显示快照数据。` +
      `可点击顶部「⚡ 实时 / 📷 快照」按钮切到纯快照模式。</div>`;
  }
}).catch(err => {
  document.getElementById("app").innerHTML =
    `<div class="loading">数据加载失败：${err.message}<br><br>请确认 data.json / data.js 与本页面在同一目录。</div>`;
});
</script>
</body>
</html>
